<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' file: data:; img-src 'self' data: blob: file: https://mamahug-1256157831.cos.ap-guangzhou.myqcloud.com https://richbrian.site; media-src 'self' blob: file:" />
  <title>Shuttle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="booting">
  <!-- data-i18n：替换文字；data-i18n-ph：替换 placeholder；data-i18n-title：替换悬停提示 -->
  <div id="appBg" class="app-bg"><div class="app-bg-img"></div></div>
  <aside class="sidebar">
    <div class="side-top"></div>
    <button id="newBtn" class="new-btn" data-i18n="newChat"></button>
    <div class="side-label"><button id="archBack" class="arch-back hidden" type="button"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span id="sideLabel" data-i18n="history"></span><div class="spacer"></div><button id="archEntry" class="arch-entry hidden" type="button"></button><button id="selectBtn" class="arch-entry" type="button" data-i18n="selectChats" data-i18n-title="selectChatsTip"></button></div>
    <div id="batchBar" class="batch-bar hidden"><span id="batchCount"></span><div class="spacer"></div><button id="batchAll" type="button" data-i18n="selectAll"></button><button id="batchArch" type="button" data-i18n="archive"></button><button id="batchDel" type="button" class="danger-text" data-i18n="delete"></button><button id="batchCancel" type="button" data-i18n="cancel"></button></div>
    <div class="conv-search-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="convSearch" class="conv-search" data-i18n-ph="searchChats" /></div>
    <div id="convList" class="conv-list"></div>
    <div class="quota-chip hidden" id="quotaChip">
      <div class="q-top"><span id="quotaPlan"></span><button id="upgradeBtn" class="link-btn" data-i18n="upgrade"></button></div>
      <div class="q-bar"><i id="quotaBar"></i></div>
      <div class="q-foot"><span class="q-text" id="quotaText"></span><button type="button" class="checkin-btn hidden" id="checkinBtn"><i class="dot"></i><span id="checkinBtnText"></span></button></div>
    </div>
    <div class="user-chip">
      <span class="avatar" id="userAvatar"></span>
      <span class="uname" id="userName"></span>
      <span class="badge hidden" id="userBadge" data-i18n="roleAdmin"></span>
      <div class="spacer"></div>
      <button id="logoutBtn" class="ghost small" data-i18n="logout"></button>
    </div>
    <button id="connBtn" class="side-bottom conn-entry side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v4"/></svg><span data-i18n="connEntry"></span></button>
    <div class="side-foot">
      <button id="settingsBtn" class="side-bottom side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="settingsBtn"></span></button>
    </div>
  </aside>

  <div class="maincol">
    <header class="topbar">
      <button id="sideToggle" class="icon-btn side-toggle" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg></button>
      <button id="sideNew" class="icon-btn side-new" type="button" data-i18n-title="newChat"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button id="wsBtn" class="ws ws-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span id="wsName"></span></button>
      <div class="spacer"></div>
      <button id="remoteChip" class="ws remote-chip hidden" type="button"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg><span data-i18n="remoteChip"></span></button>
      <button id="browserBtn" class="ws browser-btn" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9s1.3-6.5 3.8-9z"/></svg><span data-i18n="browserBtn"></span></button>
      <label class="sel-label"><span data-i18n="model"></span>
        <select id="modelSel" data-i18n-title="modelTitle"></select>
      </label>
      <label class="sel-label effort-label" data-i18n-title="effortTip">
        <select id="effortSel">
          <option value="fast" data-i18n="effortFast"></option>
          <option value="standard" data-i18n="effortStandard"></option>
          <option value="deep" data-i18n="effortDeep"></option>
        </select>
      </label>
    </header>

    <div id="banners"></div>
    <div id="mcpBanners"></div>
    <div id="longBanner" class="banner long-banner hidden"></div>
    <main id="log"></main>

    <footer class="composer">
      <button id="toBottom" class="to-bottom hidden" type="button"><svg class="tb-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span class="tb-dots"><i></i><i></i><i></i></span></button>
      <div class="composer-box">
        <div id="attachStrip" class="attach-strip hidden"></div>
        <textarea id="input" rows="1" data-i18n-ph="inputPh"></textarea>
        <div class="composer-row">
          <button id="attachBtn" class="icon-btn" data-i18n-title="attachImage" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
          </button>
          <button id="shotBtn" class="icon-btn" data-i18n-title="screenshotBtn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
          </button>
          <button id="micBtn" class="icon-btn mic-btn" data-i18n-title="voiceInput" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <span class="mic-time hidden" id="micTime"></span>
          </button>
          <input id="fileInput" type="file" multiple hidden />
          <label class="perm" data-i18n-title="permission">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <select id="approvalSel">
              <option value="ask" data-i18n="approvalAsk"></option>
              <option value="edits" data-i18n="approvalEdits"></option>
              <option value="all" data-i18n="approvalAll"></option>
            </select>
          </label>
          <button id="planModeBtn" class="plan-chip hidden" type="button" data-i18n-title="planModeTip"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg><span data-i18n="planModeBtn"></span></button>
          <div class="spacer"></div>
          <span id="suggestHint" class="suggest-hint hidden"><kbd>Tab</kbd><span data-i18n="suggestUse"></span></span>
          <button id="ctxRing" class="ctx-ring hidden" type="button"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" class="bg"/><circle cx="10" cy="10" r="7.5" class="fg"/></svg><span class="ctx-pct"></span></button>
          <div id="ctxPop" class="ctx-pop hidden"></div>
          <span id="usage" class="usage"></span>
          <button id="sendBtn" class="send-btn" data-i18n-title="send" type="button"></button>
        </div>
      </div>
      <div class="composer-hint" data-i18n="readsAuto"></div>
    </footer>
  </div>

  <!-- 内置浏览器面板：网页本身由主进程的原生视图叠在 #browserView 的位置上 -->
  <section id="browserPane" class="browser-pane hidden">
    <div class="bp-resize" id="bpResize"></div>
    <div class="bp-bar">
      <button id="bpBack" class="bp-btn" type="button" data-i18n-title="browserBack"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button id="bpFwd" class="bp-btn" type="button" data-i18n-title="browserForward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button id="bpReload" class="bp-btn" type="button" data-i18n-title="browserReload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <form id="bpForm" class="bp-url"><input id="bpUrl" spellcheck="false" data-i18n-ph="browserUrlPh" /></form>
      <span id="bpBusy" class="bp-busy hidden"><i></i><span data-i18n="browserBusy"></span></span>
      <button id="bpClose" class="bp-btn" type="button" data-i18n-title="browserClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="browserView" class="browser-view">
      <div class="bp-placeholder"><div class="bp-paused hidden" id="bpPaused" data-i18n="browserPaused"></div><p class="hint" data-i18n="browserHint"></p></div>
    </div>
    <div class="bp-loading hidden" id="bpLoading"></div>
  </section>

  <!-- 设置弹窗 -->
  <div class="modal hidden" id="settingsModal">
    <div class="card settings">
      <button class="settings-close" id="settingsClose" data-i18n-title="close" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <nav class="tabs">
        <div class="tabs-title" data-i18n="settings"></div>
        <button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-i18n="tabAccount"></span></button>
        <button data-tab="team" class="hidden"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span data-i18n="tabTeam"></span></button>
        <div class="tabs-sep"></div>
        <button data-tab="models" class="active"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3M16 7l3 3M18.5 4.5l2 2"/></svg><span data-i18n="tabModels"></span></button>
        <button data-tab="behavior"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg><span data-i18n="tabBehavior"></span></button>
        <button data-tab="safety"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg><span data-i18n="tabSafety"></span></button>
        <button data-tab="appearance"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg><span data-i18n="tabAppearance"></span></button>
        <button data-tab="mcp"><svg viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></svg><span data-i18n="tabMcp"></span></button>
        <button data-tab="remote"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg><span data-i18n="tabRemote"></span></button>
        <button data-tab="experts"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span data-i18n="tabExperts"></span></button>
        <button data-tab="schedules"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span data-i18n="tabSchedules"></span></button>
        <div class="tabs-sep"></div>
        <button data-tab="usage"><svg viewBox="0 0 24 24"><path d="M3 21h18M6 17v-6M11 17V5M16 17v-9M21 17v-3"/></svg><span data-i18n="tabUsage"></span></button>
        <button data-tab="feedback"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><span data-i18n="tabFeedback"></span></button>
        <button data-tab="data"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span data-i18n="tabData"></span></button>
        <button data-tab="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.4"/></svg><span data-i18n="tabAbout"></span></button>
      </nav>
      <div class="tab-body">
        <section data-pane="account" class="hidden">
          <h3 data-i18n="accountTitle"></h3>
          <div class="plan-box" id="planBox"></div>

          <h4 data-i18n="profile"></h4>
          <div class="set-group">
            <div class="set-row avatar-row"><span data-i18n="avatar"></span>
              <div class="avatar-edit">
                <span class="avatar big" id="profAvatar"></span>
                <button id="avatarPick" class="ghost" type="button" data-i18n="changeAvatar"></button>
                <button id="avatarRemove" class="ghost hidden" type="button" data-i18n="removeAvatar"></button>
                <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              </div>
            </div>
            <label class="set-row"><span data-i18n="nickname"></span><input id="profNickname" maxlength="50" /></label>
            <label class="set-row"><span data-i18n="email"></span><input id="profEmail" type="email" /></label>
            <div class="set-foot"><span class="form-msg" id="profMsg"></span><button id="profSave" class="ghost" data-i18n="saveProfile"></button></div>
          </div>

          <h4 data-i18n="changePassword"></h4>
          <div class="set-group">
            <label class="set-row"><span data-i18n="oldPassword"></span><input id="pwOld" type="password" autocomplete="current-password" /></label>
            <label class="set-row"><span data-i18n="newPassword"></span><input id="pwNew" type="password" autocomplete="new-password" /></label>
            <label class="set-row"><span data-i18n="confirmPassword"></span><input id="pwConfirm" type="password" autocomplete="new-password" /></label>
            <div class="set-foot"><span class="form-msg" id="pwMsg"></span><button id="pwSave" class="ghost" data-i18n="changePassword"></button></div>
          </div>

          <h4 data-i18n="devices"></h4>
          <div class="hint set-hint" data-i18n="devicesHint"></div>
          <div id="deviceList"></div>
          <div class="row set-actions"><button id="revokeOthers" class="ghost" data-i18n="revokeOthers"></button></div>

          <h4 data-i18n="mcpTokens"></h4>
          <div class="hint set-hint" data-i18n="mcpTokensHint"></div>
          <div class="mcp-url-row"><code id="mcpUrlText"></code><button id="mcpUrlCopy" class="ghost small" data-i18n="mcpUrlCopy"></button></div>
          <div class="hint set-hint" data-i18n="mcpTokensManualHint"></div>
          <div id="mcpTokenList"></div>
          <div id="mcpTokenNew" class="mcp-token-new hidden">
            <div class="hint" data-i18n="mcpTokenOnce"></div>
            <code id="mcpTokenValue"></code>
            <div class="row">
              <button id="mcpTokenCopy" class="ghost small" data-i18n="mcpTokenCopy"></button>
              <button id="mcpTokenCopyJson" class="ghost small" data-i18n="mcpTokenCopyJson"></button>
              <button id="mcpTokenCopyCli" class="ghost small" data-i18n="mcpTokenCopyCli"></button>
              <button id="mcpTokenInstall" class="ghost small" data-i18n="mcpTokenInstall"></button>
            </div>
          </div>
          <div class="row set-actions">
            <input id="mcpTokenName" maxlength="50" data-i18n-ph="mcpTokenNamePh" />
            <button id="mcpTokenCreate" class="ghost" data-i18n="mcpTokenCreate"></button>
            <span class="form-msg" id="mcpTokenMsg"></span>
          </div>


          <div id="dangerZone">
            <h4 class="danger-title" data-i18n="deleteAccount"></h4>
            <div class="set-group danger-group">
              <div class="set-row set-row-text"><span class="hint" data-i18n="deleteAccountHint"></span></div>
              <div class="set-foot"><span class="form-msg" id="delMsg"></span><input id="delPassword" type="password" autocomplete="current-password" data-i18n-ph="password" /><button id="deleteAccountBtn" class="ghost danger" data-i18n="deleteAccount"></button></div>
            </div>
          </div>
        </section>

        <section data-pane="schedules" class="hidden">
          <h3 data-i18n="schedTitle"></h3>
          <p class="hint" data-i18n="schedIntro"></p>
          <div class="row sched-top"><button id="schedAdd" class="primary" type="button" data-i18n="schedAdd"></button></div>
          <div id="schedForm" class="set-group sched-form hidden">
            <label class="set-row"><span data-i18n="schedName"></span><input id="sfTitle" maxlength="60" data-i18n-ph="schedNamePh" /></label>
            <div class="set-row set-row-col"><span data-i18n="schedPrompt"></span><textarea id="sfPrompt" rows="4" data-i18n-ph="schedPromptPh"></textarea></div>
            <label class="set-row"><span data-i18n="schedRule"></span>
              <select id="sfType">
                <option value="daily" data-i18n="schedDaily"></option>
                <option value="weekly" data-i18n="schedWeekly"></option>
                <option value="monthly" data-i18n="schedMonthly"></option>
                <option value="interval" data-i18n="schedInterval"></option>
                <option value="once" data-i18n="schedOnce"></option>
              </select>
            </label>
            <div class="set-row sf-week"><span data-i18n="schedWeekdays"></span><div class="seg" id="sfWeek"></div></div>
            <label class="set-row sf-day"><span data-i18n="schedDay"></span><input id="sfDay" type="number" min="1" max="31" value="1" /></label>
            <label class="set-row sf-time"><span data-i18n="schedTime"></span><input id="sfTime" type="time" value="09:00" /></label>
            <label class="set-row sf-minutes"><span data-i18n="schedEvery"></span><input id="sfMinutes" type="number" min="15" step="5" value="60" /></label>
            <label class="set-row sf-at"><span data-i18n="schedAt"></span><input id="sfAt" type="datetime-local" /></label>
            <div class="set-row"><span data-i18n="schedFolder"></span><span class="hint sf-ws" id="sfWs"></span></div>
            <div class="set-foot"><span class="form-msg" id="sfMsg"></span><button id="sfCancel" class="ghost" type="button" data-i18n="cancel"></button><button id="sfSave" class="primary" type="button" data-i18n="save"></button></div>
          </div>
          <div id="schedList" class="sched-list"></div>
        </section>

        <section data-pane="team" class="hidden">
          <h3 data-i18n="teamTitle"></h3>
          <p class="hint" data-i18n="teamHint"></p>
          <div class="set-group">
            <div class="set-row"><span data-i18n="teamMyRole"></span><span id="teamRole" class="team-role"></span></div>
          </div>

          <h4 data-i18n="teamMembers"></h4>
          <div id="teamMemberList"></div>
          <div id="teamLogBox">
            <h4 data-i18n="teamLogs"></h4>
            <div id="teamLogList"></div>
          </div>
        </section>

        <section data-pane="usage" class="hidden">
          <h3 data-i18n="usageTitle"></h3>
          <p class="hint" data-i18n="usageHint"></p>
          <div class="stat-row" id="usageStats"></div>
          <h4 data-i18n="last7days"></h4>
          <div id="usageDaily" class="bars"></div>
          <h4 data-i18n="byModelMonth"></h4>
          <table class="tbl" id="usageByModel"></table>
        </section>

        <section data-pane="feedback" class="hidden">
          <h3 data-i18n="feedbackTitle"></h3>
          <label class="field"><span data-i18n="feedbackType"></span>
            <select id="fbType">
              <option value="bug" data-i18n="fbBug"></option>
              <option value="suggestion" data-i18n="fbSuggestion"></option>
              <option value="other" data-i18n="fbOther"></option>
            </select>

      <h4 data-i18n="topUp"></h4>
      <div class="plan-grid packs" id="packGrid"></div>
      <div class="redeem-row"><span data-i18n="redeemLabel"></span><input id="redeemInput" maxlength="24" autocomplete="off" spellcheck="false" placeholder="SHT-XXXX-XXXX-XXXX" /><button id="redeemBtn" class="ghost small" type="button" data-i18n="redeemBtn"></button><span class="hint" id="redeemMsg"></span></div>
      <div class="order-box hidden" id="orderBox"></div>
      <details class="my-orders"><summary data-i18n="myOrders"></summary><div id="orderList"></div></details>
      <div class="row"><div class="spacer"></div><button id="planClose" class="ghost" data-i18n="close"></button></div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal hidden" id="confirmModal">
    <div class="card wide">
      <h3 id="confirmTitle"></h3>
      <div id="confirmBody" class="diff"></div>
      <div class="row">
        <div class="spacer"></div>
        <button id="confirmNo" class="ghost" data-i18n="reject"></button>
        <button id="confirmYes" class="primary" data-i18n="allow"></button>
      </div>
    </div>
  </div>

  <!-- 连接器：预设的 MCP 服务目录，点「+」一键添加 -->
  <div class="modal hidden" id="connModal">
    <div class="card conn-card">
      <div class="conn-head">
        <div class="seg big" id="connModes">
          <button data-mode="mcp" class="active" data-i18n="connModeMcp"></button>
          <button data-mode="skill" data-i18n="connModeSkill"></button>
        </div>
        <div class="seg" id="connTabs">
          <button data-ctab="discover" class="active" data-i18n="connDiscover"></button>
          <button data-ctab="mine" data-i18n="connMine"></button>
        </div>
        <div class="spacer"></div>
        <input id="connSearch" type="search" data-i18n-ph="connSearch" />
        <button id="connCustom" class="ghost small" data-i18n="connCustom"></button>
        <button id="skillInstallBtn" class="ghost small hidden" data-i18n="skillInstall"></button>
        <button id="connClose" class="ghost small conn-x">×</button>
      </div>
      <div class="conn-cats" id="connCats"></div>
      <div class="hint conn-note hidden" id="connNote"></div>
      <div class="conn-grid" id="connGrid"></div>
    </div>
  </div>

  <!-- 从链接 / 本地文件夹安装技能 -->
  <div class="modal hidden" id="skillModal">
    <div class="card">
      <h3 data-i18n="skillInstallTitle"></h3>
      <p class="hint" data-i18n="skillInstallDesc"></p>
      <div class="secret-row"><input id="skillSource" type="text" spellcheck="false" data-i18n-ph="skillInstallPh" /></div>
      <div class="form-msg" id="skillMsg"></div>
      <div class="row">
        <button id="skillPick" class="ghost" data-i18n="skillPickLocal"></button>
        <div class="spacer"></div>
        <button id="skillCancel" class="ghost" data-i18n="cancel"></button>
        <button id="skillGo" class="primary" data-i18n="skillInstallBtn"></button>
      </div>
    </div>
  </div>

  <!-- MCP 需要安装运行环境时征求用户同意 -->
  <div class="modal hidden" id="askModal">
    <div class="card">
      <h3 id="askTitle"></h3>
      <p id="askBody" class="ask-body"></p>
      <div class="row">
        <div class="spacer"></div>
        <button id="askNo" class="ghost"></button>
        <button id="askYes" class="primary"></button>
      </div>
    </div>
  </div>

  <!-- 安全输入框：MCP 需要的 Token / Key 由用户在这里填，不进入对话、不发给模型 -->
  <div class="modal hidden" id="secretModal">
    <div class="card">
      <h3 id="secretTitle"></h3>
      <p id="secretDesc" class="ask-body"></p>
      <a id="secretHelp" class="hidden"></a>
      <div class="secret-row">
        <input id="secretInput" type="password" autocomplete="off" spellcheck="false" />
        <button id="secretShow" class="ghost small"></button>
      </div>
      <p class="hint" id="secretNote"></p>
      <div class="row">
        <div class="spacer"></div>
        <button id="secretCancel" class="ghost"></button>
        <button id="secretOk" class="primary"></button>
      </div>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="markdown.js"></script>
  <script src="voice.js"></script>
  <script src="picker.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
