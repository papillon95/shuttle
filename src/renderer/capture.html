<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Shuttle</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; font: 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; }
    #mask { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.42); }
    #sel { position: fixed; display: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.42); outline: 1.5px solid #4c8dff; background-repeat: no-repeat; }
    #size { position: fixed; display: none; padding: 2px 7px; border-radius: 5px; background: rgba(0, 0, 0, 0.72); color: #fff; font-variant-numeric: tabular-nums; }
    #tip { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 9px; background: rgba(20, 20, 20, 0.78); color: #fff; font-size: 13px; pointer-events: none; }
  </style>
</head>
<body>
  <img id="bg" alt="" />
  <div id="mask"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="tip"></div>
  <script src="capture.js"></script>
</body>
</html>
